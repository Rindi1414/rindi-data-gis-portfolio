backend:
  name: github
  repo: Rindi1414/rindi-data-gis-portfolio
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - label: "Portfolio Content"
    name: "portfolio"
    files:
      - label: "Main Content"
        name: "content"
        file: "data/content.json"
        format: "json"
        fields:
          - label: "Profile"
            name: "profile"
            widget: "object"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Intro", name: "intro", widget: "text"}
              - {label: "About Title", name: "aboutTitle", widget: "string"}
              - {label: "About", name: "about", widget: "text"}
              - {label: "Contact Text", name: "contactText", widget: "text"}
              - {label: "CV URL", name: "cv", widget: "string", required: false}

          - label: "About Points"
            name: "aboutPoints"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}

          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Items", name: "items", widget: "list"}

          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Project Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Data Analysis", "Data Visualization", "GIS / WebGIS", "Remote Sensing", "Other"]}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Tools", name: "tools", widget: "list"}
              - {label: "Project Image", name: "image", widget: "image", required: false}
              - {label: "Project Link", name: "link", widget: "string", required: false}

          - label: "Experience"
            name: "experience"
            widget: "list"
            fields:
              - {label: "Period", name: "period", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Organization", name: "organization", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          - label: "Education"
            name: "education"
            widget: "object"
            fields:
              - {label: "Degree", name: "degree", widget: "string"}
              - {label: "Institution", name: "institution", widget: "string"}
              - {label: "Period", name: "period", widget: "string"}
              - {label: "GPA", name: "gpa", widget: "string"}

          - label: "Certificates"
            name: "certificates"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Certificate / Training", name: "name", widget: "string"}
              - {label: "Issuer", name: "issuer", widget: "string"}

          - label: "Contacts"
            name: "contacts"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
